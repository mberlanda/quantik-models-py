name: "Build"

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: "build sdist + wheel"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check the metadata renders
        run: python -m twine check dist/*

      - name: Check what is actually in the artifacts
        # `twine check` validates metadata and says nothing about the
        # payload. The payload is where the irreversible mistakes are: an
        # sdist that picked up `runs/` uploads gigabytes of differently
        # licensed weights to PyPI, and PyPI never lets a filename be
        # replaced.
        run: python scripts/check_dist.py dist/

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install:
    name: "install from wheel (${{ matrix.os }}, py${{ matrix.python-version }})"
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the wheel
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the wheel, and only the wheel
        # Deliberately no checkout and no extras. This is the configuration a
        # user gets from `pip install quantik-models`, and it is the one that
        # broke last time: `quantik_core` was imported at module scope by the
        # classical engines and never declared, which every local venv here
        # hid by having it installed editable from a sibling checkout. A
        # clean install failed on the first move.
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$(ls dist/*.whl)"

      - name: The base install has to work on its own
        shell: bash
        run: |
          python - <<'PY'
          import quantik_models
          from quantik_models import hub
          from quantik_models.arena import registry
          from quantik_models.env import fastboard as fb

          print("version", quantik_models.__version__)

          # The four published models must resolve without a network call.
          assert set(hub.PUBLISHED) == {"cpool", "attn", "resnet", "mlp"}
          assert hub.repo_id("cpool") == "brpoplpush/quantik-cpool-c191-b6"

          # The rules engine is a *declared* dependency, so the classical
          # agents must import and a legality mask must be computable with
          # no extras installed at all.
          boards = fb.empty_boards(1)
          assert fb.legal_masks(boards).shape == (1, 64)

          # Typed package, not an untyped one that happens to have hints.
          from importlib.resources import files
          assert files("quantik_models").joinpath("py.typed").is_file()
          print("base install ok")
          PY

      - name: Console scripts have to run without any extra
        # Five of the six must work on the base install. `quantik-models-play`
        # is the one that matters most: the storeless Docker image installs
        # `[serve]` and no torch, so a module-scope torch import anywhere under
        # `play/` breaks a published deployment and nothing else would notice.
        # `quantik-models-fetch` matters for the same reason in reverse: it is
        # what fills a cache during an image build, before torch exists.
        # `quantik-models-train` is excluded because training genuinely needs
        # the torch extra.
        shell: bash
        run: |
          for script in quantik-models-materialize quantik-models-figures \
                        quantik-models-hf-stage quantik-models-play \
                        quantik-models-fetch; do
            "$script" --help > /dev/null || { echo "FAILED: $script"; exit 1; }
            echo "ok $script"
          done

      - name: Serve the vendored app and API on a free port
        shell: bash
        run: |
          python - <<'PY'
          import http.client
          import json
          import socket
          import subprocess
          import sys
          import threading
          import time

          # Pick a free port
          with socket.socket() as s:
              s.bind(("", 0))
              port = s.getsockname()[1]

          srv = subprocess.Popen(
              [sys.executable, "-m", "quantik_models.play",
               "--host", "127.0.0.1",
               "--port", str(port), "--no-store"],
              stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True,
          )

          # Drain the pipe continuously, not just on the error paths — a
          # server writing enough startup output to fill the OS pipe buffer
          # would otherwise block on write() forever with nobody reading,
          # deadlocking the job even on the success path.
          output_lines: list[str] = []

          def _drain() -> None:
              for line in srv.stdout:
                  output_lines.append(line)

          reader = threading.Thread(target=_drain, daemon=True)
          reader.start()

          def _output() -> str:
              reader.join(timeout=5)
              return "".join(output_lines)

          try:
              # Wait for the server to start listening with a 30 second deadline
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  # Check if process has exited early
                  if srv.poll() is not None:
                      raise SystemExit(
                          f"server exited with {srv.returncode} before becoming ready:\n{_output()}"
                      )

                  try:
                      socket.create_connection(("127.0.0.1", port), timeout=0.5).close()
                      break
                  except OSError:
                      time.sleep(0.2)
              else:
                  # Server didn't start within 30 seconds
                  srv.terminate()
                  try:
                      srv.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      srv.kill()
                      srv.wait()

                  raise SystemExit(f"server did not become ready within 30 seconds:\n{_output()}")
  
              # Fetch / — should return the vendored app (HTML)
              conn = http.client.HTTPConnection("127.0.0.1", port, timeout=5)
              conn.request("GET", "/")
              resp = conn.getresponse()
              body = resp.read().decode()
              assert resp.status == 200, f"GET / returned {resp.status}"
              assert "text/html" in resp.getheader("Content-Type", "")
              assert "Quantik" in body
              print("GET / ok — HTML app served")
  
              # Fetch /api — should return JSON
              conn.request("GET", "/api")
              resp = conn.getresponse()
              payload = json.loads(resp.read().decode())
              assert resp.status == 200, f"GET /api returned {resp.status}"
              assert isinstance(payload, dict)
              print("GET /api ok — json:", list(payload.keys()))
              conn.close()
          finally:
              srv.terminate()
              try:
                  srv.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  srv.kill()
                  srv.wait()
          PY

      - name: The hub extra resolves and imports
        shell: bash
        run: |
          python -m pip install "$(ls dist/*.whl)[hub]"
          python -c "import huggingface_hub; print('hub extra ok')"

      - name: A cold cache with no network fails with the fix, not a traceback
        # The worst case the fetch path has to handle gracefully. HF_HUB_OFFLINE
        # with an empty HF_HOME is exactly "no network, nothing cached", and it
        # is reproducible in CI where a real outage is not.
        shell: bash
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          python - <<'PY'
          import tempfile
          from quantik_models import hub

          with tempfile.TemporaryDirectory() as empty:
              try:
                  hub.resolve("cpool", cache_dir=empty)
              except hub.HubError as exc:
                  message = str(exc)
              else:
                  raise SystemExit("offline resolve unexpectedly succeeded")

          assert "quantik-models-fetch cpool" in message, message
          assert empty in message, message
          print("offline failure is actionable:", message)
          PY
