name: "Publish image to GHCR"

# The image pulls CC BY-NC 4.0 weights from the Hugging Face Hub at build
# time, so every build republishes the weights. Trigger only on releases and
# manual dispatch, not on every push to main.
"on":
  release:
    types: [published]
  workflow_dispatch:

permissions:
  packages: write

jobs:
  publish:
    name: "publish to GHCR"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/quantik-models-play"
          if [ "${{ github.event_name }}" == "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAGS="${IMAGE_NAME}:${TAG},${IMAGE_NAME}:latest"
          else
            TAGS="${IMAGE_NAME}:latest"
          fi
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
