name: "Tests"

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    name: "pytest (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with every optional extra
        run: |
          python -m pip install --upgrade pip
          # Against the *published* core, not a sibling main. A unit-test
          # workflow that checks out quantik-core-py at HEAD couples this
          # repo's green to another repo's in-flight work, which is the
          # circular wait that stalled the 1.2.0 release for six weeks.
          pip install "quantik-core>=1.2,<2"
          pip install -e ".[dev,arrow,torch,onnx]" \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Assert every optional dependency is importable
        # Most of this suite guards itself with `pytest.importorskip`, so a
        # missing extra turns into a green run with a third of the tests
        # silently skipped rather than into a failure. Fail loudly here
        # instead.
        run: |
          python - <<'PY'
          import importlib
          for name in (
              "torch", "safetensors", "onnx", "onnxscript", "onnxruntime",
              "pyarrow", "quantik_core.artifact_data", "quantik_core.contracts",
          ):
              importlib.import_module(name)
              print("ok", name)
          PY

      - name: Run the unit tests
        run: python -m pytest -q -rs --junitxml=junit.xml

      - name: Fail if any test was skipped
        # With every extra installed there is nothing left to skip, so a
        # skip means an import guard fired and a whole module went
        # unexercised. That is the failure mode this job exists to catch.
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          suite = ET.parse("junit.xml").getroot().find("testsuite")
          skipped = int(suite.get("skipped", "0"))
          print(f"{suite.get('tests')} tests, {skipped} skipped")
          if skipped:
              for case in suite.iter("testcase"):
                  if case.find("skipped") is not None:
                      print(f"  skipped: {case.get('classname')}::{case.get('name')}")
              sys.exit("optional dependencies are installed; nothing should skip")
          PY
